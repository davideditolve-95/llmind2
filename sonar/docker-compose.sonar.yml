version: "3.8"

services:
  sonarqube:
    image: sonarqube:community
    container_name: llmind_sonar
    ports:
      - "9000:9000"
    networks:
      - sonar-net
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonar
    depends_on:
      - sonar-db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar-db:
    image: postgres:15-alpine
    container_name: llmind_sonar_db
    networks:
      - sonar-net
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data

networks:
  sonar-net:
    driver: bridge

volumes:
  sonar-db-data:
