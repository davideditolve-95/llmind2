# SonarQube Project Configuration
sonar.projectKey=llmind2
sonar.projectName=LLMind2
sonar.projectVersion=1.0.0
sonar.scm.disabled=true

# Encoding
sonar.sourceEncoding=UTF-8

# Source folders to analyze (relative to repository root)
sonar.sources=backend/app,frontend/app,frontend/components,frontend/lib

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,backend/tests/**,frontend/tests/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx

# Test folders
sonar.tests=backend/tests,frontend/tests
sonar.test.inclusions=backend/tests/**/*.py,frontend/tests/**/*.ts,frontend/tests/**/*.tsx

# Code Coverage Reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
