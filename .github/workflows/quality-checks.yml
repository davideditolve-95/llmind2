name: Quality Checks

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-checks:
    name: Tests and SonarQube analysis
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Node.js for frontend
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run backend tests with Python 3.11
        working-directory: backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: sqlite:///./sonar-ci.db
          DATA_DIR: /tmp/llmind2-sonar-data
          SECRET_KEY: sonar-ci-secret
          ICD11_API_URL: http://localhost:8082
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          uv python install 3.11
          uv venv --python 3.11 .venv
          . .venv/bin/activate
          python --version
          uv pip install --index-strategy unsafe-best-match -r requirements.txt \
            pytest==8.2.1 \
            pytest-cov==5.0.0 \
            pytest-asyncio==0.23.7 \
            pytest-mock==3.14.0
          pytest --cov=app --cov-report=xml:coverage.xml

      - name: Publish SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://o4sn9bs961jvxn32hs18a81p.89.168.29.98.sslip.io:9000' }}
        with:
          args: >
            -Dproject.settings=sonar/sonar-project.properties

      - name: Verify SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'http://o4sn9bs961jvxn32hs18a81p.89.168.29.98.sslip.io:9000' }}
